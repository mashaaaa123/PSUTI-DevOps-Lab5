<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог артистов</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        form { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
        button { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
        button.delete { background: #dc3545; }
        button.delete:hover { background: #c82333; }
        button.edit { background: #ffc107; color: black; }
        ul { list-style-type: none; padding: 0; }
        li { background: #fff; border: 1px solid #ddd; margin-bottom: 10px; padding: 15px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .artist-info { flex: 1; cursor: pointer; }
        .artist-name { font-weight: bold; font-size: 1.1em; }
        .events-list { margin-top: 10px; font-size: 0.9em; color: #555; padding-left: 20px; display: none; }
        .actions { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Каталог артистов и групп</h1>
        
        <h2>Добавить / Редактировать</h2>
        <form id="artist-form">
            <input type="hidden" id="artist-id">
            <input type="text" id="artist-name" placeholder="Имя артиста или группы" required>
            <input type="text" id="artist-genre" placeholder="Жанр">
            <button type="submit" id="submit-btn">Добавить</button>
            <button type="button" onclick="resetForm()" style="background: #6c757d;">Отмена</button>
        </form>

        <h2>Список артистов</h2>
        <ul id="artists-list"></ul>
    </div>

    <script>
        const API_URL = '/api/v1/artists';

        document.addEventListener('DOMContentLoaded', fetchArtists);
        document.getElementById('artist-form').addEventListener('submit', handleFormSubmit);

        async function fetchArtists() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Ошибка сети');
                const data = await response.json();
                // Бэкенд возвращает объект с массивом в поле data, а не просто массив
                renderArtists(data.data || data); 
            } catch (error) {
                console.error('Ошибка при загрузке:', error);
            }
        }

        function renderArtists(artists) {
            const list = document.getElementById('artists-list');
            list.innerHTML = '';
            
            if (!artists || artists.length === 0) {
                list.innerHTML = '<li>Список пуст</li>';
                return;
            }

            artists.forEach(artist => {
                const li = document.createElement('li');
                // Бэкенд использует primary_genre_code вместо genre
                li.innerHTML = `
                    <div class="artist-info" onclick="toggleEvents(this, '${artist.id}')">
                        <div class="artist-name">${artist.name}</div>
                        <div>Жанр: ${artist.primary_genre_code || 'Не указан'}</div>
                        <div class="events-list" id="events-${artist.id}">Загрузка событий...</div>
                    </div>
                    <div class="actions">
                        <button class="edit" onclick="editArtist('${artist.id}', '${artist.name}', '${artist.primary_genre_code || ''}')">Ред.</button>
                        <button class="delete" onclick="deleteArtist('${artist.id}')">Удалить</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('artist-id').value;
            const name = document.getElementById('artist-name').value;
            const genre = document.getElementById('artist-genre').value;

            const method = id ? 'PATCH' : 'POST'; // Бэкенд использует PATCH для обновления
            const url = id ? `${API_URL}/${id}` : API_URL;

            try {
                await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, primary_genre_code: genre })
                });
                resetForm();
                fetchArtists();
            } catch (error) {
                console.error('Ошибка сохранения:', error);
            }
        }

        async function deleteArtist(id) {
            if (!confirm('Удалить артиста и все его мероприятия?')) return;

            try {
        
                let response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });

            
                if (response.status === 409) {
                    console.log('У артиста есть события. Начинаем каскадное удаление...');
                    
                    const eventsRes = await fetch(`/api/v1/events?artist_id=${id}`);
                    if (!eventsRes.ok) throw new Error('Не удалось получить список событий');
                    
                    const eventsData = await eventsRes.json();
                    const events = eventsData.data || eventsData; // Учитываем структуру ответа

                 
                    if (events && events.length > 0) {
                    
                        const deletePromises = events.map(event => 
                            fetch(`/api/v1/events/${event.id}`, { method: 'DELETE' })
                        );
                        
                      
                        await Promise.all(deletePromises);
                        console.log(`Удалено событий: ${events.length}`);
                    }

                    response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                }

                if (response.ok || response.status === 204) {
                    console.log('Артист успешно удален');
                    fetchArtists(); 
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `Ошибка сервера: ${response.status}`);
                }

            } catch (error) {
                console.error('Ошибка удаления:', error);
                alert('Не удалось удалить артиста: ' + error.message);
            }

        function editArtist(id, name, genre) {
            document.getElementById('artist-id').value = id;
            document.getElementById('artist-name').value = name;
            document.getElementById('artist-genre').value = genre;
            document.getElementById('submit-btn').textContent = 'Сохранить';
        }

        function resetForm() {
            document.getElementById('artist-form').reset();
            document.getElementById('artist-id').value = '';
            document.getElementById('submit-btn').textContent = 'Добавить';
        }

        async function toggleEvents(element, artistId) {
            const eventsList = element.querySelector('.events-list');
            
            if (eventsList.style.display === 'block') {
                eventsList.style.display = 'none';
                return;
            }
            
            eventsList.style.display = 'block';
            
            try {
                // Запрашиваем события по ID артиста, как указано в openapi
                const res = await fetch(`/api/v1/events?artist_id=${artistId}`); 
                const data = await res.json();
                const events = data.data || data; // Бэкенд может возвращать объект с data
                
                if (!events || events.length === 0) {
                    eventsList.innerHTML = 'Нет событий';
                } else {
                    eventsList.innerHTML = events.map(e => `<div>📅 ${e.title} (${new Date(e.starts_at).toLocaleDateString()})</div>`).join('');
                }
            } catch (err) {
                eventsList.innerHTML = 'Не удалось загрузить события.';
            }
        }
    </script>
</body>
</html>
